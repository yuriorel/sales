sales:
  db:
    schema: sales_online_test
  messaging:
    topic: sales_online_test

spring:
  ai:
    # tests use the fakes in support/FakeAiConfig; OpenAiIT switches the real models back on
    model:
      chat: none
      embedding: none
  data:
    redis:
      database: 1
  flyway:
    clean-disabled: false
  kafka:
    consumer:
      group-id: sales-test

server:
  port: 0
  ssl:
    enabled: false
